name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Small dense solves gain nothing from BLAS threads; avoid oversubscription.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the package so mypy sees numpy/scipy/matplotlib types.
      - run: pip install -e . "black>=26.1,<27" flake8 mypy
      - run: black --check src/ tests/ scripts/
      # flake8 settings (line length, excludes) live in setup.cfg
      - run: flake8 src/ tests/ scripts/
      # mypy settings (non-strict, check_untyped_defs) live in pyproject.toml
      - run: mypy src/enaqt/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=enaqt --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_qutip.py -v
        timeout-minutes: 10
